name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # The host contract check needs an installed Harness desktop app and runs locally before packaging (npm run pack:plugin).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:interaction
