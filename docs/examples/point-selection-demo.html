<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>点选修改 · 本地演示</title>
  <style>
    :root { --brand: #315edd; --ink: #202b40; --muted: #68748a; --space: 16px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 38px; font: 15px/1.65 system-ui, "Microsoft YaHei", sans-serif; color: var(--ink); background: #f4f6fa; }
    main { max-width: 780px; margin: auto; }
    .eyebrow { color: var(--brand); font-size: 12px; letter-spacing: .12em; }
    h1 { font-size: 30px; line-height: 1.3; margin: 12px 0; }
    .intro { color: var(--muted); margin-bottom: 28px; }
    .card { background: white; border: 1px solid #e1e7f0; border-radius: 18px; padding: 28px; }
    .card h2 { margin: 0 0 8px; font-size: 21px; }
    .card p { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space); margin-top: 26px; }
    button { border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; cursor: pointer; }
    .secondary { color: var(--ink); background: #edf1f7; }
    .primary { color: white; background: var(--brand); }
    .note { font-size: 12px; color: var(--muted); margin-top: 20px; }
    @media (max-width: 520px) { body { padding: 20px; } .card { padding: 22px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DSH REGION EDIT / 0.4.0</div>
    <h1>点中要改的地方，再说你的想法。</h1>
    <p class="intro">这个独立页面用于查看插件效果，可以放心选择元素。</p>
    <section class="card">
      <h2>让页面更合心意</h2>
      <p>试着点选蓝色按钮，然后选择外层，查看两个按钮所在容器的布局。</p>
      <div class="actions">
        <button class="secondary">立即开始</button>
        <button class="primary"><span>立即开始</span></button>
      </div>
    </section>
    <p class="note">两个按钮文字相同；原始标签的位置不同。展开“定位信息”可以查看对应行号、class、颜色变量和外层布局。</p>
  </main>
</body>
</html>
